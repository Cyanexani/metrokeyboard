name: Metroboard Auto Release CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Build Release APKs (All Architectures)
        run: ./gradlew clean assembleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-apks/ \;
          ls -la release-apks/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metroboard-release-apks
          path: release-apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Metroboard Release' }}
          body: |
            ## Metroboard Release
            Automatic build of release APKs for all architectures:
            - `arm64-v8a`
            - `armeabi-v7a`
            - `x86`
            - `x86_64`
            - `universal`
            
            Built with commit: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
